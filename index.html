    :root {
      --verde-950: #163629;
      --verde-900: #1d4634;
      --verde-800: #315d44;
      --verde-700: #3c7052;
      --icono-verde: #00d098;
      --verde-100: #294536;
      --verde-050: #21362a;
      --tinta: #f1f5f2;
      --texto: #9da8a1;
      --linea: #393d3a;
      --blanco: #ffffff;
      --fondo: #1f1f1f;
      --superficie: #252725;
      --superficie-2: #121413;
      --sombra: 0 16px 42px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--tinta);
      background: var(--fondo);
      font-family: "Inter", "Aptos", "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, select, a { font: inherit; }

    .page {
      width: min(1460px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 390px);
      gap: 30px;
      align-items: center;
      min-height: 230px;
      padding: 38px 42px;
      border: 1px solid rgba(0, 71, 53, .12);
      border-radius: 24px;
      color: #10271e;
      background: #00d098;
      box-shadow: none;
    }

    .hero::before,
    .hero::after {
      position: absolute;
      z-index: -1;
      content: "";
      border-radius: 50%;
      border: 1px solid rgba(16, 39, 30, .10);
    }

    .hero::before {
      width: 360px;
      height: 360px;
      right: 18%;
      top: -250px;
    }

    .hero::after {
      width: 520px;
      height: 520px;
      right: -330px;
      bottom: -420px;
    }

    .eyebrow {
      display: flex;
      gap: 9px;
      align-items: center;
      margin: 0 0 14px;
      color: #174c3a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 26px;
      height: 2px;
      border-radius: 999px;
      background: #163629;
      content: "";
    }

    h1 {
      max-width: 780px;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: clamp(30px, 4vw, 50px);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .hero-copy {
      max-width: 670px;
      margin: 16px 0 0;
      color: rgba(16, 39, 30, .74);
      font-size: 15px;
      line-height: 1.6;
    }

    .version-panel {
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 17px;
      background: linear-gradient(135deg, #055947 0%, #04624c 52%, #026850 100%);
      box-shadow: inset 0 1px rgba(255, 255, 255, .08);
    }

    .version-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, .82);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .version-status {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      color: #e6f2ea;
      letter-spacing: 0;
      text-transform: none;
    }

    .version-status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00d098;
      box-shadow: 0 0 0 4px rgba(0, 208, 152, .14);
      content: "";
    }

    .select-wrap { position: relative; }

    .select-wrap::after {
      position: absolute;
      top: 50%;
      right: 17px;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--verde-800);
      border-bottom: 2px solid var(--verde-800);
      content: "";
      pointer-events: none;
      transform: translateY(-70%) rotate(45deg);
    }

    #versionSelect {
      width: 100%;
      min-height: 54px;
      padding: 0 44px 0 16px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 12px;
      outline: none;
      color: var(--verde-950);
      background: var(--blanco);
      font-size: 15px;
      font-weight: 700;
      appearance: none;
      cursor: pointer;
      transition: box-shadow .2s ease;
    }

    #versionSelect:focus-visible {
      box-shadow: 0 0 0 4px rgba(157, 226, 182, .34);
    }

    .version-help {
      margin: 10px 2px 0;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      align-items: center;
      padding: 28px 4px 14px;
    }

    .active-version {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid #3a5142;
      border-radius: 999px;
      color: #ffffff;
      background: var(--verde-050);
      font-size: 12px;
      font-weight: 700;
    }

    .active-version svg { width: 15px; height: 15px; }

    .section {
      margin-top: 22px;
      padding: 0 4px 4px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .section-head {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 19px;
    }

    .section-title { margin: 0; font-size: 16px; }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 13px;
    }

    .nav-card {
      --accent: var(--icono-verde);
      position: relative;
      overflow: hidden;
      display: flex;
      gap: 13px;
      align-items: center;
      min-height: 94px;
      padding: 17px;
      border: 1px solid #3a3e3b;
      border-radius: 15px;
      color: var(--tinta);
      background: var(--superficie-2);
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(22, 54, 41, .035);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .nav-card::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--accent, var(--verde-800));
      content: "";
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .18s ease;
    }

    .nav-card:hover,
    .nav-card:focus-visible {
      border-color: #52745e;
      outline: none;
      box-shadow: 0 12px 25px rgba(22, 54, 41, .10);
      transform: translateY(-3px);
    }

    .nav-card:hover::after,
    .nav-card:focus-visible::after { transform: scaleX(1); }

    .icon-box {
      display: grid;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 14px;
      color: var(--accent, var(--verde-800));
      background: color-mix(in srgb, var(--accent, var(--verde-800)) 26%, #252725);
    }

    .icon-box svg { width: 24px; height: 24px; }

    .card-copy {
      min-width: 0;
      flex: 1;
    }

    .card-title {
      display: block;
      margin-bottom: 4px;
      font-family: "Segoe UI", "Aptos", Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -.01em;
    }

    .card-action {
      display: flex;
      gap: 5px;
      align-items: center;
      color: #929c96;
      font-size: 11px;
      font-weight: 600;
    }

    .card-action svg { width: 13px; height: 13px; }

    .toast {
      position: fixed;
      z-index: 30;
      right: 22px;
      bottom: 22px;
      max-width: min(380px, calc(100vw - 44px));
      padding: 14px 16px;
      border-radius: 13px;
      color: #fff;
      background: var(--verde-950);
      box-shadow: 0 16px 38px rgba(0, 0, 0, .2);
      font-size: 13px;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1050px) {
      .link-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 780px) {
      .page { padding: 14px; }

      .hero {
        grid-template-columns: 1fr;
        padding: 30px 25px;
        border-radius: 20px;
      }

      .link-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .page { padding: 10px; }
      .hero { padding: 27px 20px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .section { padding: 0 0 4px; }
      .link-grid { grid-template-columns: 1fr; }
      .nav-card { min-height: 84px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

    };

    const VERSIONES = {
      "estimado-jun-26": {
        label: "Estimado Jun-26",
        links: { ...ENLACES_MODELOS }
      },
      "estimado-sep-26": {
        label: "Estimado Sep-26",
        links: Object.fromEntries(
          Object.keys(ENLACES_MODELOS).map(id => [id, "#"])
        )
      },
      "presupuesto-2027": {
        label: "Presupuesto 2027",
        links: {
          ...Object.fromEntries(
            Object.keys(ENLACES_MODELOS).map(id => [id, "#"])
          ),
          ventas: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQCAL5hdZNGmQbIwFo-ZwXX_ARugM8tCHwa5paIXhDI6WPI?e=H2vQoJ",
          costosFijos: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQARr3z786AqT62OEDaCUudKAdjoULjyf8ENm9XXycULnRE?e=gVik9C",
          gastosAdministracion: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQCdUXLT7tNNQ4-e5xtClNsjAXclsuFcBpXfhBhbUpETGrQ?e=edWEpU",
          gastosFijosVentas: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQADyWUaCNtlQo7BD1m-7_fsAaGsPIWDEfKpwXdx3qLa4cE?e=if7x83",
          gastosTransversales: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQD70GCPhKekS4PaWXF_NrR8Aa7j8QCROeLgNNc2FernGRU?e=3lDmVz",
          inversionConsumidor: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQDCs6AJ6kRNRajJDFZEq_UdAVymTgG61vpn3FVoHDUmXJ0?e=nQCr5Y",
          costos: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQBpKzmhuBSDS7BrHPsgT7UhAR-92ZLeNVaJv0ylp9KexDg?e=A1HgAW",
          compras: "https://alimentostoning.sharepoint.com/:x:/s/presupuestoyreforecast/IQDXMPMDc9jhRoF3v1qmUXQ1AYUw10zJ4Ni442ETKDLlXMA?e=6uAbsS"


        }
      }
    };

    const SECCIONES = [
      {
        title: "Comercial y Mercadeo",
        items: [
          { id: "ventas", title: "Ventas", icon: "i-chart", accent: "#24734a" },
          { id: "inversionCliente", title: "Inversión al cliente", icon: "i-users", accent: "#35755c" },
          { id: "inversionConsumidor", title: "Inversión al consumidor", icon: "i-tag", accent: "#8a6941" }
        ]
      },
      {
        title: "Costos y operación",
        items: [
          { id: "costos", title: "Costos", icon: "i-coins", accent: "#315d44" },
          { id: "costosFijos", title: "Costos fijos", icon: "i-wallet", accent: "#536b55" },
          { id: "compras", title: "Compras", icon: "i-cart", accent: "#436d75" },
          { id: "nomina", title: "Nómina", icon: "i-briefcase", accent: "#6c6651" },
          { id: "fletes", title: "Fletes", icon: "i-truck", accent: "#557682" }
        ]
      },
      {
        title: "Gastos de estructura",
        items: [
          { id: "gastosVariablesVentas", title: "Gastos variables de ventas", icon: "i-chart", accent: "#7c653e" },
          { id: "gastosFijosVentas", title: "Gastos fijos de ventas", icon: "i-tag", accent: "#756146" },
          { id: "gastosAdministracion", title: "Gastos fijos de administración", icon: "i-building", accent: "#5d6871" },
          { id: "gastosTransversales", title: "Costos y gastos fijos transversales", icon: "i-layers", accent: "#626b5a" }
        ]
      },
      {
        title: "Estados financieros",
        items: [
          { id: "estadosFinancieros", title: "Modelo de estados financieros", icon: "i-chart" }
        ]
      }
    ];

    const versionSelect = document.getElementById("versionSelect");
    const sectionsContainer = document.getElementById("sections");
    const activeVersionText = document.querySelector("#activeVersion span");
    const toast = document.getElementById("toast");
    let toastTimer;

    function iconSvg(iconId, className = "") {
      return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#${iconId}"/></svg>`;
    }

    function renderVersionOptions() {
      Object.entries(VERSIONES).forEach(([id, version]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = version.label;
        versionSelect.appendChild(option);
      });
    }

    function renderSections() {
      sectionsContainer.innerHTML = SECCIONES.map((section, index) => `
        <section class="section" aria-labelledby="section-${index}">
          <div class="section-head">
            <div>
              <h3 class="section-title" id="section-${index}">${section.title}</h3>
            </div>
          </div>
          <div class="link-grid">
            ${section.items.map(item => `
              <a class="nav-card" data-link-id="${item.id}" href="#" target="_blank" rel="noopener noreferrer" aria-label="Abrir ${item.title}">
                <span class="icon-box">${iconSvg("i-database")}</span>
                <span class="card-copy">
                  <span class="card-title">${item.title}</span>
                </span>
              </a>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function applyVersion(versionId, announce = false) {
      const version = VERSIONES[versionId];
      if (!version) return;

      document.querySelectorAll("[data-link-id]").forEach(card => {
        const url = version.links[card.dataset.linkId] || "#";
        card.href = url;
        card.dataset.pending = url === "#" ? "true" : "false";
      });

      activeVersionText.textContent = version.label;
      localStorage.setItem("portalVersion", versionId);
      if (announce) showToast(`Versión activa: ${version.label}`);
    }

    function init() {
      renderVersionOptions();
      renderSections();

      const savedVersion = localStorage.getItem("portalVersion");
      const initialVersion = VERSIONES[savedVersion] ? savedVersion : Object.keys(VERSIONES)[0];
      versionSelect.value = initialVersion;
      applyVersion(initialVersion);

      versionSelect.addEventListener("change", event => applyVersion(event.target.value, true));

      sectionsContainer.addEventListener("click", event => {
        const card = event.target.closest(".nav-card");
        if (card && card.dataset.pending === "true") {
          event.preventDefault();
          showToast("Este enlace aún no ha sido configurado para la versión seleccionada.");
        }
      });
    }

    init();
  </script>
